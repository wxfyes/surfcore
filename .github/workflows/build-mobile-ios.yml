name: Build iOS IPA

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-mobile-ios.yml'
  workflow_dispatch: # 支持在 GitHub 网页上手动一键点击运行

jobs:
  build-ios:
    name: Build Unsigned IPA on macOS
    runs-on: macos-14 # 使用 GitHub 官方提供的免费 Apple Silicon (M1/M2) 云主机

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build unsigned iOS IPA
        run: |
          cd mobile
          # 编译未签名的 iOS 归档并生成 Payload IPA
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r SurfCore伴侣_iOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SurfCore伴侣_iOS_未签名包
          path: mobile/build/ios/iphoneos/SurfCore伴侣_iOS.ipa
          retention-days: 7
